services:
  # 🤖 Бот - интерфейс и логика Telegram
  bot:
    build: .
    container_name: raspis_bot
    restart: always
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DB_HOST=db
      - DB_USER=postgres
      - DB_PASSWORD=ugmk_postgres_pass
      - DB_NAME=tu_bot
    volumes:
      - bot_data:/app/data
      - shared_cache:/app/cache
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    command: python bot.py

  # ⚙️ Воркеры (Скраперы) - парсинг сайта
  worker:
    build: .
    restart: always
    env_file:
      - .env
    environment:
      # Override inherited proxy settings: the university portal is direct.
      - PROXY_URL=
      - HTTP_PROXY=
      - HTTPS_PROXY=
      - ALL_PROXY=
      - http_proxy=
      - https_proxy=
      - all_proxy=
      - NO_PROXY=*
      - no_proxy=*
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DB_HOST=db
      - DB_USER=postgres
      - DB_PASSWORD=ugmk_postgres_pass
      - DB_NAME=tu_bot
    volumes:
      - shared_cache:/app/cache
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    deploy:
      replicas: 5
    command: python scraper.py

  # 🗄️ База данных (Redis) - кэш и очередь
  redis:
    image: redis:alpine
    container_name: redis_db
    restart: always
    volumes:
      - redis_data:/data
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # 🐘 База данных (PostgreSQL) - реляционные данные
  db:
    image: postgres:16-alpine
    container_name: postgres_db
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=ugmk_postgres_pass
      - POSTGRES_DB=tu_bot
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tu_bot"]
      interval: 5s
      timeout: 3s
      retries: 10

  # 🖥️ Веб-панель управления администратора
  dashboard:
    build: .
    container_name: admin_dashboard
    restart: always
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - DB_USER=postgres
      - DB_PASSWORD=ugmk_postgres_pass
      - DB_NAME=tu_bot
      - REDIS_HOST=redis
    ports:
      - "127.0.0.1:${ADMIN_PORT:-8081}:8080"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn web_runtime:admin_app --host 0.0.0.0 --port 8080

  # Public Mini App has its own process, port and restart cycle.
  miniapp:
    build: .
    container_name: tu_miniapp
    restart: always
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - DB_USER=postgres
      - DB_PASSWORD=ugmk_postgres_pass
      - DB_NAME=tu_bot
      - REDIS_HOST=redis
    ports:
      - "127.0.0.1:${MINIAPP_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn web_runtime:miniapp_app --host 0.0.0.0 --port 8080
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"]
      interval: 20s
      timeout: 5s
      start_period: 30s
      retries: 3

  # Optional permanent HTTPS endpoint; enable after setting DNS and MINIAPP_DOMAIN.
  caddy:
    image: caddy:2-alpine
    profiles: ["https"]
    restart: always
    environment:
      - MINIAPP_DOMAIN=${MINIAPP_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      miniapp:
        condition: service_healthy

volumes:
  redis_data:
  bot_data:
  shared_cache:
  pg_data:
  caddy_data:
  caddy_config:
